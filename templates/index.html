<!DOCTYPE html>
<html>
<head>
    <title>News Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>📰 News Recommendation System</h1>

    <form method="POST">
        <input type="text" name="news" placeholder="Enter topic (e.g. cricket, politics)" required>
        <button type="submit">Search</button>
    </form>

    <div class="results">
    {% if results %}
        <h2>Top Recommendations</h2>
        <ul class="result-list">
            {% for item in results %}
                <li class="result-item">
                    <div class="result-header">
                        <span class="title">{{ loop.index }}. {{ item.headline }}</span>
                        <span class="score">Score: {{ item.score }}</span>
                    </div>
                </li>
            {% endfor %}
        </ul>
    {% endif %}
</div>

</body>
</html>
